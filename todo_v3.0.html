<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="todo.css">
    <!-- link for google icons to embed -->
    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body data-mode="light" data-theme="sky">
  
        <nav id="nav">
            <h1>My Tasks</h1>
            <div id="theme-panel">
                <button id="mode-toggle" class="mode-toggle">🏙️</button>
                <div id="theme-picker">
                    <span class="theme" data-theme="jelly">🪼</span>
                    <span class="theme" data-theme="sakura">🌸</span>
                    <span class="theme" data-theme="dino">🦖</span>
                </div>
            </div>
        </nav>
        <div id="container">
            <div id="inputarea">
        <input type="text" id="taskinput" placeholder="Enter a task">

        <button id="addbtn">Add</button>
        <p id="error"></p>
            </div>
        <div id="taskArea"></div>
    </div>
    <!-- linking the javascript file for this project -->
    <script src="script.js"></script>

</body>
</html>
